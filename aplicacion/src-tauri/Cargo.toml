[package]
name = "cinta"
version = "0.6.2"
edition = "2021"
license = "MIT"

[lib]
name = "cinta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"   # una sola ventana: «Abrir con» reutiliza la app abierta (Rust puro + windows-sys, ARM64 ok)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Todas las dependencias siguientes son Rust puro o compilan SQLite dentro de la app (ARM64 seguro)
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
walkdir = "2"
base64 = "0.22"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
